name: Common OpenCodeReview

on:
  workflow_call:
    secrets:
      DEEPSEEK_API_KEY:
        required: false
      QWEN_API_KEY:
        required: false

# A newer authorized /review command supersedes a review that is still running.
# Other comments get unique groups, so they cannot cancel a PR review.
concurrency:
  group: >-
    ${{
      github.event.issue.pull_request
      && github.event.comment.user.type != 'Bot'
      && contains(fromJSON('["gmelodie","vladopajic","richard-ramos"]'), github.event.comment.user.login)
      && (github.event.comment.body == '/review' || startsWith(github.event.comment.body, '/review '))
      && format('ocr-pr-{0}', github.event.issue.number)
      || format('ocr-noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: >-
      github.event.issue.pull_request
      && github.event.comment.user.type != 'Bot'
      && contains(fromJSON('["gmelodie","vladopajic","richard-ramos"]'), github.event.comment.user.login)
      && (github.event.comment.body == '/review' || startsWith(github.event.comment.body, '/review '))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Acknowledge review command
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });
      
      - name: Resolve model and pull request refs
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const providers = {
              deepseek: {
                url: 'https://api.deepseek.com/chat/completions',
                secret: 'DEEPSEEK_API_KEY',
                extraBody: '{"thinking":{"type":"enabled"}}',
              },
              qwen: {
                url: 'https://token-plan.maas.qwencloudapi.com/compatible-mode/v1/chat/completions',
                secret: 'QWEN_API_KEY',
                extraBody: '{"enable_thinking":true}',
              },
            };

            const models = {
              pro: { id: 'deepseek-v4-pro', provider: 'deepseek' },
              flash: { id: 'deepseek-flash', provider: 'deepseek' },
              max: { id: 'qwen3.8-max', provider: 'qwen' },
              // DeepSeek
              'deepseek-pro': { id: 'deepseek-v4-pro', provider: 'deepseek' },
              'deepseek-flash': { id: 'deepseek-flash', provider: 'deepseek' },
              // Qwen
              'qwen-max': { id: 'qwen3.8-max', provider: 'qwen' },
              'qwen-flash': { id: 'qwen3.8-flash', provider: 'qwen' },
              'qwen-plus': { id: 'qwen3.7-plus', provider: 'qwen' },
            };

            try {
              const command = context.payload.comment.body.trim();
              const match = /^\/review(?: +([A-Za-z0-9._-]+))?$/i.exec(command);
              const requestedModel = match && (match[1] || 'pro').toLowerCase();
              const model = requestedModel && models[requestedModel];
              if (!model) {
                throw new Error(
                  `Unsupported model. Use /review MODEL. Supported models: ${Object.keys(models).join(', ')}.`
                );
              }

              const provider = providers[model.provider];
              if (!provider) {
                throw new Error(`Provider configuration is missing for ${model.provider}.`);
              }

              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });

              core.setOutput('model', model.id);
              core.setOutput('llm_url', provider.url);
              core.setOutput('llm_auth_secret', provider.secret);
              core.setOutput('llm_extra_body', provider.extraBody);
              core.setOutput('base_ref', pr.base.ref);
              core.setOutput('head_sha', pr.head.sha);
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              core.setOutput('error', message);
              core.setFailed(message);
            }

      - name: Report model resolution error
        if: ${{ failure() && steps.pr.outcome == 'failure' }}
        uses: actions/github-script@v7
        env:
          ERROR_MESSAGE: ${{ steps.pr.outputs.error || 'Failed to resolve the review model or pull request.' }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `OpenCodeReview could not start: ${process.env.ERROR_MESSAGE}`,
            });


      # The shared rules are checked out from this trusted repository, never
      # from the pull request branch being reviewed.
      - name: Check out shared Nim rules
        uses: actions/checkout@v4
        with:
          repository: vacp2p/common-open-code-review
          ref: main
          path: .common-open-code-review

      # OCR checks out the consumer at the workspace root, deleting the shared
      # checkout. Materialize self-contained rules outside that workspace first.
      - name: Prepare shared Nim rules
        id: rules
        shell: bash
        env:
          RULE_SOURCE: ${{ github.workspace }}/.common-open-code-review/.opencodereview
        run: |
          rules_dir="$(mktemp -d "$RUNNER_TEMP/common-ocr-rules.XXXXXX")"
          test -s "$RULE_SOURCE/nim-code-review.md"
          jq --rawfile nim "$RULE_SOURCE/nim-code-review.md" '
            .rules |= map(
              if .path == "**/*.nim" then
                .rule = (
                  (.rule | split("[shared Nim code-review rules](nim-code-review.md)") | join("shared Nim code-review rules below"))
                  + "\n\n" + $nim
                )
              else . end
            )
          ' "$RULE_SOURCE/rule.json" > "$rules_dir/rule.json"
          echo "path=$rules_dir/rule.json" >> "$GITHUB_OUTPUT"

      # Do not pin this reference or set ocr_version: both intentionally track
      # the newest OpenCodeReview action and CLI release.
      - name: Review with OpenCodeReview
        uses: alibaba/open-code-review@main
        with:
          llm_url: ${{ steps.pr.outputs.llm_url }}
          llm_auth_token: ${{ secrets[steps.pr.outputs.llm_auth_secret] }}
          llm_model: ${{ steps.pr.outputs.model }}
          llm_use_anthropic: 'false'
          llm_extra_body: ${{ steps.pr.outputs.llm_extra_body }}
          base_ref: ${{ steps.pr.outputs.base_ref }}
          head_sha: ${{ steps.pr.outputs.head_sha }}
          rule: ${{ steps.rules.outputs.path }}
