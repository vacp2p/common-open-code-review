name: Common OpenCodeReview
description: Review pull requests with the current Alibaba OpenCodeReview action and shared Nim rules.

inputs:
  llm_url:
    description: OpenAI-compatible LLM endpoint.
    required: true
  llm_auth_token:
    description: LLM authentication token.
    required: true
  llm_model:
    description: Model to use for the review.
    required: true
  llm_use_anthropic:
    description: Whether the endpoint uses the Anthropic protocol.
    required: false
    default: 'false'
  base_ref:
    description: Trusted base ref, when the event does not provide one.
    required: false
  head_sha:
    description: Pull request head SHA, when the event does not provide one.
    required: false

runs:
  using: composite
  steps:
    # Do not pin this reference or set ocr_version: both intentionally track
    # the newest OpenCodeReview action and CLI release.
    - name: Review with OpenCodeReview
      uses: alibaba/open-code-review@main
      with:
        llm_url: ${{ inputs.llm_url }}
        llm_auth_token: ${{ inputs.llm_auth_token }}
        llm_model: ${{ inputs.llm_model }}
        llm_use_anthropic: ${{ inputs.llm_use_anthropic }}
        base_ref: ${{ inputs.base_ref }}
        head_sha: ${{ inputs.head_sha }}
        # This resides in the reviewed action, not in the PR checkout.
        rule: ${{ github.action_path }}/.opencodereview/rule.json
